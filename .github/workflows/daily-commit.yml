name: Daily Commit

on:
  schedule:
    - cron: "0 9 * * *" # her gün 12:00 TR saati (UTC 09:00)
  workflow_dispatch: # manuel tetikleme

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "sahinsanli"
          git config user.email "sahinsanli123@gmail.com"

      - name: Create 3 daily commits
        run: |
          TODAY=$(TZ=Europe/Istanbul date '+%Y-%m-%d')
          for i in 1 2 3; do
            echo "- \`$TODAY\` günlük otomatik güncelleme #$i" >> commits.md
            git add commits.md
            git commit -m "daily update $TODAY #$i"
          done
          git push
